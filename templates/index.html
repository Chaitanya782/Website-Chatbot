<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chatbot</title>
        <style>
            :root {
                --primary-color: #4F46E5;
                --primary-light: #EEF2FF;
                --text-color: #1F2937;
                --light-gray: #F9FAFB;
                --border-color: #E5E7EB;
                --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                line-height: 1.6;
                color: var(--text-color);
                background-color: #ffffff;
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
                opacity: 0;
                animation: fade-in 0.6s ease-out forwards;
            }

            @keyframes fade-in {
                0% {
                    opacity: 0;
                    transform: translateY(20px);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .container {
                background-color: #ffffff;
                border-radius: 12px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }

            .header {
                background-color: var(--primary-color);
                color: white;
                padding: 20px;
                text-align: center;
                position: relative;
                overflow: hidden;
            }

            .header h2 {
                font-size: 1.8rem;
                font-weight: 600;
                margin: 0;
                animation: float 3s ease-in-out infinite;
            }

            @keyframes float {
                0%, 100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-5px);
                }
            }

            .glow {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 70%);
                opacity: 0;
                animation: glow 4s ease-in-out infinite;
            }

            @keyframes glow {
                0%, 100% {
                    opacity: 0;
                }
                50% {
                    opacity: 1;
                }
            }

            .wave {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 15px;
                background: linear-gradient(90deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0.3) 100%);
                clip-path: polygon(
                    0% 0%, 4% 20%, 8% 40%, 12% 60%, 16% 80%, 20% 100%,
                    24% 80%, 28% 60%, 32% 40%, 36% 20%, 40% 0%,
                    44% 20%, 48% 40%, 52% 60%, 56% 80%, 60% 100%,
                    64% 80%, 68% 60%, 72% 40%, 76% 20%, 80% 0%,
                    84% 20%, 88% 40%, 92% 60%, 96% 80%, 100% 100%
                );
                animation: wave 3s linear infinite;
            }

            @keyframes wave {
                0% {
                    transform: translateX(-25%);
                }
                100% {
                    transform: translateX(25%);
                }
            }

            .chat-container {
                padding: 20px;
            }

            .input-group {
                display: flex;
                gap: 8px;
                position: relative;
                margin-bottom: 24px;
                animation: slide-up 0.5s ease-out 0.3s both;
            }

            @keyframes slide-up {
                0% {
                    opacity: 0;
                    transform: translateY(20px);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .input-group input {
                flex: 1;
                padding: 14px 16px;
                border: 1px solid var(--border-color);
                border-radius: 8px;
                font-size: 16px;
                outline: none;
                transition: all 0.3s ease;
            }

            .input-group input:focus {
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
                transform: translateY(-2px);
            }

            .input-group button {
                background-color: var(--primary-color);
                color: white;
                border: none;
                border-radius: 8px;
                padding: 12px 24px;
                font-size: 16px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.3s ease;
                position: relative;
                overflow: hidden;
            }

            .input-group button:hover {
                background-color: #4338CA;
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            }

            .input-group button:active {
                transform: translateY(0);
            }

            .ripple {
                position: absolute;
                background: rgba(255, 255, 255, 0.5);
                border-radius: 50%;
                transform: scale(0);
                animation: ripple 0.6s linear;
                pointer-events: none;
            }

            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }

            .response-container {
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
                transform-origin: top center;
                animation: slide-up 0.5s ease-out 0.5s both;
            }

            .response-header {
                background-color: var(--primary-light);
                color: var(--primary-color);
                padding: 12px 16px;
                font-weight: 600;
                border-bottom: 1px solid var(--border-color);
                display: flex;
                align-items: center;
            }

            .status-indicator {
                display: inline-block;
                width: 8px;
                height: 8px;
                background-color: var(--primary-color);
                border-radius: 50%;
                margin-right: 8px;
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% {
                    transform: scale(0.8);
                    opacity: 0.5;
                }
                50% {
                    transform: scale(1.2);
                    opacity: 1;
                }
                100% {
                    transform: scale(0.8);
                    opacity: 0.5;
                }
            }

            .response-content {
                padding: 16px;
                background-color: var(--light-gray);
                min-height: 100px;
                border-radius: 0 0 8px 8px;
                line-height: 1.6;
                transition: all 0.3s ease;
                position: relative;
            }

            .thinking {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .dot {
                width: 8px;
                height: 8px;
                background-color: var(--primary-color);
                border-radius: 50%;
                opacity: 0;
                animation: bounce 1.4s infinite;
            }

            .dot:nth-child(1) {
                animation-delay: 0s;
            }

            .dot:nth-child(2) {
                animation-delay: 0.2s;
            }

            .dot:nth-child(3) {
                animation-delay: 0.4s;
            }

            @keyframes bounce {
                0%, 60%, 100% {
                    transform: translateY(0);
                    opacity: 0.5;
                }
                30% {
                    transform: translateY(-10px);
                    opacity: 1;
                }
            }

            .text-appear {
                animation: text-reveal 0.5s ease-out;
            }

            @keyframes text-reveal {
                0% {
                    opacity: 0;
                    transform: translateY(10px);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Custom scrollbar */
            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                background: var(--light-gray);
            }

            ::-webkit-scrollbar-thumb {
                background: var(--primary-color);
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #4338CA;
            }

            @media (max-width: 768px) {
                body {
                    padding: 16px;
                }

                .input-group {
                    flex-direction: column;
                }

                .input-group button {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="glow"></div>
                <h2>AI Chatbot</h2>
                <div class="wave"></div>
            </div>

            <div class="chat-container">
                <div class="input-group">
                    <input type="text" id="question" placeholder="Enter your question..." autofocus>
                    <button onclick="askQuestion()" id="askButton">Ask</button>
                </div>

                <div class="response-container">
                    <div class="response-header">
                        <span class="status-indicator"></span>
                        Response
                    </div>
                    <div class="response-content" id="response">Ask me anything and I'll respond here...</div>
                </div>
            </div>
        </div>

        <script>
            // DOM elements
            const questionInput = document.getElementById("question");
            const askButton = document.getElementById("askButton");
            const responseDiv = document.getElementById("response");
            const responseContainer = document.querySelector(".response-container");

            // Add event listener for Enter key
            questionInput.addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    askQuestion();
                }
            });

            // Create ripple effect
            askButton.addEventListener("mousedown", function(e) {
                const button = this;
                const ripple = document.createElement("span");
                const rect = button.getBoundingClientRect();

                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size/2;
                const y = e.clientY - rect.top - size/2;

                ripple.className = "ripple";
                ripple.style.width = ripple.style.height = size + "px";
                ripple.style.left = x + "px";
                ripple.style.top = y + "px";

                button.appendChild(ripple);

                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });

            async function askQuestion() {
                const question = questionInput.value.trim();
                if (!question) return;

                // Reset animations
                responseContainer.style.animation = "none";
                void responseContainer.offsetHeight; // Force reflow
                responseContainer.style.animation = "slide-up 0.5s ease-out";

                // Show thinking animation
                responseDiv.innerHTML = '<div class="thinking">Thinking <div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

                // Disable input and button during processing
                questionInput.disabled = true;
                askButton.disabled = true;
                askButton.style.opacity = "0.7";

                try {
                    const res = await fetch("/ask", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ question })
                    });

                    if (!res.ok) {
                        throw new Error("Server error");
                    }

                    const data = await res.json();

                    // Clear response div first
                    responseDiv.innerHTML = "";

                    // Add text reveal animation
                    setTimeout(() => {
                        responseDiv.classList.add("text-appear");
                        responseDiv.innerHTML = data.answer;
                    }, 300);

                } catch (error) {
                    responseDiv.innerHTML = "";
                    setTimeout(() => {
                        responseDiv.classList.add("text-appear");
                        responseDiv.textContent = "Sorry, there was an error processing your request. Please try again.";
                    }, 300);
                } finally {
                    // Re-enable input and button with animation
                    setTimeout(() => {
                        questionInput.disabled = false;
                        askButton.disabled = false;
                        askButton.style.opacity = "1";

                        // Clear input with animation
                        questionInput.style.transition = "background-color 0.3s";
                        questionInput.style.backgroundColor = "#f0f9ff";
                        questionInput.value = "";
                        setTimeout(() => {
                            questionInput.style.backgroundColor = "";
                            questionInput.focus();
                        }, 300);
                    }, 600);
                }
            }
        </script>
    </body>
</html>
